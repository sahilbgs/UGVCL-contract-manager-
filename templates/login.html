<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f2027">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192x192.png') }}">
    <title>Login | UGVCL Portal Contract Manager</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
    <style>
        /* Splash Screen Style */
        .splash-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #002B49;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999999;
            opacity: 1;
            transition: opacity 0.5s cubic-bezier(0.25, 1, 0.5, 1), visibility 0.5s;
            overflow: hidden;
        }
        .splash-content {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .splash-ring-outer {
            position: relative;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
            animation: splashScaleIn 1s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .splash-ring-inner {
            position: absolute;
            top: -5px;
            left: -5px;
            right: -5px;
            bottom: -5px;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: #fb8500;
            border-bottom-color: #ffb703;
            animation: splashSpin 2s linear infinite;
            box-shadow: 0 0 15px rgba(251, 133, 0, 0.4);
        }
        .splash-logo {
            width: 110px;
            height: 110px;
            object-fit: contain;
            border-radius: 50%;
            background-color: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            animation: logoPulse 2s ease-in-out infinite alternate;
        }
        .splash-title {
            color: #ffffff;
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-top: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
            opacity: 0;
            animation: splashFadeUp 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards 0.3s;
        }
        .splash-subtitle {
            color: #ffb703;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 4px;
            margin-bottom: 30px;
            opacity: 0;
            animation: splashFadeUp 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards 0.5s;
        }
        .splash-progress {
            width: 140px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
            opacity: 0;
            animation: fadeIn 0.4s ease forwards 0.7s;
        }
        .splash-progress-bar {
            position: absolute;
            height: 100%;
            width: 40%;
            background: linear-gradient(90deg, #ffb703, #fb8500);
            border-radius: 2px;
            animation: progressMoving 1.5s infinite ease-in-out;
        }
        @keyframes splashScaleIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes splashSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes logoPulse {
            0% { transform: scale(0.96); box-shadow: 0 4px 10px rgba(251, 133, 0, 0.2); }
            100% { transform: scale(1.04); box-shadow: 0 4px 25px rgba(251, 133, 0, 0.6); }
        }
        @keyframes splashFadeUp {
            0% { transform: translateY(15px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        @keyframes progressMoving {
            0% { left: -40%; }
            50% { left: 100%; width: 50%; }
            100% { left: 100%; width: 0%; }
        }

        body {
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Outfit', sans-serif;
            margin: 0;
            overflow: auto;
            padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
        }
        .login-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }
        .login-card:hover {
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.4);
            transform: translateY(-2px);
        }
        .login-title {
            color: #ffffff;
            font-weight: 700;
            font-size: 26px;
            letter-spacing: 0.5px;
        }
        .login-subtitle {
            color: #b0c4de;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .form-label {
            color: #e2e8f0;
            font-weight: 500;
            font-size: 14px;
        }
        .form-control {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #ffffff;
            padding: 12px 16px;
            transition: all 0.2s;
        }
        .form-control:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: #00b4d8;
            box-shadow: 0 0 0 3px rgba(0, 180, 216, 0.25);
            color: #ffffff;
        }
        .btn-login {
            background: linear-gradient(90deg, #00b4d8 0%, #0077b6 100%);
            border: none;
            border-radius: 10px;
            color: #ffffff;
            font-weight: 600;
            padding: 12px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0, 180, 216, 0.3);
        }
        .btn-login:hover {
            background: linear-gradient(90deg, #00c4e8 0%, #008cc6 100%);
            box-shadow: 0 6px 20px rgba(0, 180, 216, 0.5);
            transform: scale(1.02);
        }
        .logo-icon {
            background: linear-gradient(135deg, #ffb703 0%, #fb8500 100%);
            width: 60px;
            height: 60px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 8px 20px rgba(251, 133, 0, 0.4);
        }
        @media (max-width: 480px) {
            .login-card {
                padding: 20px 16px;
                border-radius: 16px;
                max-width: 100%;
                margin: 0 16px;
            }
            .login-title {
                font-size: 22px;
            }
            .logo-icon {
                width: 50px;
                height: 50px;
            }
        }
    </style>
</head>
<body>

<!-- Splash Screen Overlay -->
<div id="splash-screen" class="splash-container">
    <div class="splash-content">
        <div class="splash-ring-outer">
            <div class="splash-ring-inner"></div>
            <img src="{{ url_for('static', filename='dist/img/logo.png') }}" alt="UGVCL Logo" class="splash-logo">
        </div>
        <div class="splash-title">UGVCL</div>
        <div class="splash-subtitle">CONTRACTOR APP</div>
        <div class="splash-progress">
            <div class="splash-progress-bar"></div>
        </div>
    </div>
</div>

<div class="login-card text-center">
    <div class="logo-container mb-4">
        <img src="{{ url_for('static', filename='dist/img/logo.png') }}" alt="UGVCL Logo" class="login-app-logo" style="width: 80px; height: 80px; border-radius: 50%; background: #ffffff; padding: 4px; box-shadow: 0 4px 15px rgba(251, 133, 0, 0.3);">
    </div>
    <h2 class="login-title">UGVCL Portal</h2>
    <p class="login-subtitle">Contract Manager Login</p>

    <!-- Flash messages inside login -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category == 'danger' and 'danger' or 'success' }} alert-dismissible fade show border-0 text-sm py-2 px-3 mb-4" role="alert" style="border-radius: 10px;">
                    {{ message }}
                    <button type="button" class="btn-close py-2" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form action="{{ url_for('login') }}" method="POST" class="text-start">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" name="username" class="form-control" id="username" placeholder="Enter username" required autocomplete="off">
        </div>
        <div class="mb-4">
            <label for="password" class="form-label">Password</label>
            <input type="password" name="password" class="form-control" id="password" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn btn-login w-100 mt-2">Sign In</button>
    </form>
    
    <div class="text-center mt-4 text-xs" style="color: #6c7a89;">
        Enter your administrative or manager credentials to sign in.
    </div>

</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Splash screen handler
    document.addEventListener("DOMContentLoaded", function() {
        const splash = document.getElementById("splash-screen");
        if (splash) {
            const hasShown = sessionStorage.getItem('splash_shown');
            if (hasShown) {
                splash.style.display = "none";
            } else {
                sessionStorage.setItem('splash_shown', 'true');
                setTimeout(function() {
                    splash.style.opacity = "0";
                    setTimeout(function() {
                        splash.style.display = "none";
                    }, 500);
                }, 1800);
            }
        }
    });
</script>
</body>
</html>
